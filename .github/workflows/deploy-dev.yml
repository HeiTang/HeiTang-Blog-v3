name: Deploy dev to Cloudflare Pages

on:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-dev
      url: https://dev.purr.tw
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 22 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked npm dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build static site with Astro
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INVITE_CODES_API_URL: ${{ vars.INVITE_CODES_API_URL }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}

      - name: Verify the build and generate the search index
        run: |
          npm run check:font-subsets
          npm run check:seo
          npx pagefind --site dist

      - name: Deploy the dev preview
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the account ID in the cloudflare-dev environment}"
          : "${CLOUDFLARE_API_TOKEN:?Set the Pages API token in the cloudflare-dev environment}"
          printf '\n/*\n  X-Robots-Tag: noindex\n' >> dist/_headers
          npx --yes wrangler@4.61.1 pages deploy dist \
            --project-name heitang-blog --branch dev \
            --commit-hash "$GITHUB_SHA" --commit-dirty=false
